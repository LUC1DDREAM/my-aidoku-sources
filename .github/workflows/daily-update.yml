name: Daily source update

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-source-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Refresh and validate sources
        run: python3 scripts/update_sources.py

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll CHECKSUMS.sha256 README.md icons index.json index.min.json inventory.json sources
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore: daily source update"
            git push
          fi
